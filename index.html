<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub Terra II — Au bord de l'enfer</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── Minimal additions for the hotseat frontend ── */
  #screen-game { flex-direction: column; }
  #game-board-area {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, #2a1f17 0%, var(--c-bg) 70%);
    overflow: hidden;
  }
  #board-svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #board-svg.dragging { cursor: grabbing; }
  #hud-panel {
    position: absolute; top: 10px; left: 10px;
    width: 220px; max-height: calc(100% - 180px);
    padding: 12px; overflow-y: auto;
    z-index: 20; border-radius: 10px;
    background: rgba(20,16,12,.72); backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #hud-panel h3 { color: var(--c-ember); font-size: 13px; margin: 0 0 8px; letter-spacing: 1px; }
  .hud-active { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--c-border); }
  .hud-active-name { font-size: 16px; font-weight: 700; }
  .hud-active-role { font-size: 11px; color: var(--c-ember); }
  .hud-hp { display: flex; gap: 3px; margin: 4px 0; }
  .hud-ap { font-size: 12px; color: var(--c-text-dim); }
  .hud-state-tag { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: var(--c-panel-2); }
  .hud-state-tag.down { background: var(--c-blood); color: #fff; }
  .hud-state-tag.dead { background: #400; color: #999; }
  .hud-team-list { display: flex; flex-direction: column; gap: 6px; }
  .hud-team-member {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 6px; border-radius: 6px;
    background: rgba(42,32,26,.6); border: 1px solid var(--c-border);
  }
  .hud-team-member.current { border-color: var(--c-ember); box-shadow: 0 0 8px rgba(245,166,35,.3); }
  .hud-team-member .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .hud-team-member .tm-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hud-team-member .tm-hp { font-size: 11px; color: var(--c-blood); }
  .hud-volcano {
    margin-top: 8px; padding: 6px 8px; border-radius: 6px;
    background: var(--c-panel-2); font-size: 12px;
  }
  .hud-volcano .vlabel { color: var(--c-text-dim); }
  .hud-volcano .vpos { font-weight: 700; color: var(--c-ember); }
  .hud-keys { margin-top: 4px; font-size: 12px; color: var(--c-gold); }
  #action-bar {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 12px 16px; max-width: 90%; z-index: 25;
    background: rgba(20,16,12,.78); backdrop-filter: blur(10px);
    border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  #action-bar .act-btn {
    padding: 8px 14px; font-size: 13px; border-radius: 8px;
    border: 1px solid var(--c-border); background: var(--c-panel-2);
    color: var(--c-text); cursor: pointer; font-family: inherit;
    transition: all .12s;
  }
  #action-bar .act-btn:hover:not(:disabled) { border-color: var(--c-ember); background: var(--c-panel); }
  #action-bar .act-btn:disabled { opacity: .3; cursor: not-allowed; }
  #action-bar .act-btn.ability { border-color: var(--c-gold); }
  #action-bar .act-btn.end-turn { background: linear-gradient(180deg, var(--c-lava), var(--c-lava-dim)); border-color: var(--c-gold); color: #fff; font-weight: 700; }
  #action-bar .act-btn.peril { background: var(--c-lava-dim); color: #fff; font-weight: 700; border-color: var(--c-gold); animation: pulse 1s infinite; }
  #log-panel {
    position: absolute; bottom: 10px; right: 10px;
    width: 260px; max-height: 200px; z-index: 20;
    background: rgba(20,16,12,.72); backdrop-filter: blur(8px);
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #log-panel .log-header { padding: 6px 10px; font-size: 11px; font-weight: 700; color: var(--c-ember); letter-spacing: 2px; text-transform: uppercase; background: var(--c-panel); }
  #log-content { overflow-y: auto; padding: 6px 10px; font-size: 11px; line-height: 1.5; color: var(--c-text-dim); max-height: 170px; }
  .log-entry { padding: 1px 0; }
  .log-entry.system { color: var(--c-ember); font-style: italic; }
  .log-entry.peril { color: var(--c-lava); }
  .target-highlight { fill: var(--c-ember); opacity: .25; cursor: pointer; }
  .target-highlight:hover { opacity: .5; }
  .edge-highlight { stroke: var(--c-ember); stroke-width: 5; fill: rgba(212,161,59,.01); cursor: pointer; pointer-events: all; }
  .edge-highlight.available { fill: rgba(212,161,59,.2); animation: pulse 1.5s infinite; }
  .edge-highlight:hover { stroke: #fff; fill: rgba(255,255,255,.3); }
  #peril-result {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 200; padding: 20px 40px; border-radius: 12px;
    background: var(--c-panel); border: 2px solid var(--c-ember);
    box-shadow: 0 0 30px rgba(245,166,35,.5); text-align: center;
    font-size: 24px; display: none;
  }
  #peril-result.show { display: block; animation: peril-show .3s; }
  @keyframes peril-show { from { opacity: 0; transform: translate(-50%,-50%) scale(.8); } }
  #zoom-controls {
    position: absolute; bottom: 80px; right: 290px;
    display: flex; flex-direction: column; gap: 4px; z-index: 25;
  }
  #zoom-controls .btn { padding: 4px 10px; font-size: 16px; }
  .toast-zone {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    background: var(--c-panel); border: 1px solid var(--c-border); border-left: 4px solid var(--c-ember);
    padding: 10px 18px; border-radius: 4px; box-shadow: var(--shadow);
    font-size: 14px; color: var(--c-text); max-width: 420px;
    animation: toast-in .3s ease, toast-out .3s ease 2.4s forwards;
  }
  .toast.bad { border-left-color: var(--c-blood); }
  .toast.peril { border-left-color: var(--c-lava); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-12px); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>

<!-- ===================== TITLE SCREEN ===================== -->
<div id="screen-title" class="screen active">
  <div class="title-overlay">
    <h1 class="game-title">SUB TERRA II</h1>
    <p class="game-subtitle">Au bord de l'enfer</p>
    <button id="btn-local-game" class="btn btn-primary btn-lg">Jouer en local (hotseat)</button>
  </div>
</div>

<!-- ===================== SETUP SCREEN ===================== -->
<div id="screen-setup" class="screen">
  <div class="panel setup-panel">
    <h2>Préparation de l'expédition</h2>

    <div class="setup-section">
      <h3>Difficulté</h3>
      <div class="difficulty" id="difficulty-select">
        <button data-d="beginner" class="btn btn-toggle">Débutant</button>
        <button data-d="normal" class="btn btn-toggle active">Normal</button>
        <button data-d="advanced" class="btn btn-toggle">Avancé</button>
        <button data-d="expert" class="btn btn-toggle">Expert</button>
      </div>
    </div>

    <div class="setup-section">
      <h3>Choix des Explorateurs (3–6)</h3>
      <p class="hint">Cliquez sur un Explorateur pour l'ajouter / le retirer de l'équipe.</p>
      <div class="explorer-gallery" id="explorer-gallery"></div>
      <div class="team-order" id="team-order">
        <span class="team-label">Ordre du tour : </span>
        <span class="team-empty">(sélectionnez des Explorateurs)</span>
      </div>
    </div>

    <div class="setup-actions">
      <button class="btn btn-ghost btn-back" id="btn-setup-back">← Retour</button>
      <button id="btn-start" class="btn btn-primary btn-lg">Commencer l'exploration</button>
    </div>
  </div>
</div>

<!-- ===================== GAME SCREEN ===================== -->
<div id="screen-game" class="screen">
  <div id="game-board-area">
    <svg id="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="zoom-controls">
    <button id="zoom-in" class="btn btn-ghost btn-icon" title="Zoom +">+</button>
    <button id="zoom-out" class="btn btn-ghost btn-icon" title="Zoom −">−</button>
    <button id="zoom-fit" class="btn btn-ghost btn-icon" title="Recentrer">⊡</button>
  </div>
  <div id="hud-panel"></div>
  <div id="action-bar"></div>
  <div id="log-panel">
    <div class="log-header">Journal</div>
    <div id="log-content"></div>
  </div>
</div>

<!-- ===================== END SCREEN ===================== -->
<div id="screen-end" class="screen">
  <div class="end-content" id="end-content"></div>
</div>

<!-- ===================== OVERLAYS ===================== -->
<div id="peril-result"></div>
<div class="toast-zone" id="toast-zone"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
